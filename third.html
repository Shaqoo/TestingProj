<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Dreamscape</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:#02030a;
      font-family:Arial, Helvetica, sans-serif;
    }

    canvas{
      display:block;
    }

    .ui{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:10;
    }

    .hero{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      text-align:center;
      color:white;
    }

    .hero h1{
      font-size:clamp(3rem, 9vw, 8rem);
      letter-spacing:8px;
      font-weight:900;
      text-transform:uppercase;

      background:linear-gradient(
        90deg,
        #00f0ff,
        #7a5cff,
        #ff3cac
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      animation:pulse 3s ease-in-out infinite;
    }

    .hero p{
      margin-top:18px;
      color:#ffffffaa;
      letter-spacing:5px;
      font-size:14px;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        filter:drop-shadow(0 0 20px #00f0ff44);
      }

      50%{
        transform:scale(1.03);
        filter:drop-shadow(0 0 40px #ff3cac88);
      }

      100%{
        transform:scale(1);
        filter:drop-shadow(0 0 20px #7a5cff55);
      }
    }

    .glass{
      position:absolute;
      bottom:30px;
      left:50%;
      transform:translateX(-50%);
      width:320px;
      padding:18px;

      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);

      backdrop-filter:blur(12px);
      border-radius:20px;

      color:white;
      text-align:center;
      font-size:14px;
      letter-spacing:2px;
    }
  </style>
</head>
<body>

  <div class="ui">
    <div class="hero">
      <h1>NEON VOID</h1>
      <p>THREE.JS FUTURISTIC EXPERIENCE</p>
    </div>

    <div class="glass">
      Move your mouse • Watch the world react ✨
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

    // Scene
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 2, 8);

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias:true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);

    // Mouse interaction
    const mouse = {
      x:0,
      y:0
    };

    window.addEventListener("mousemove", (e)=>{

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // Fog
    scene.fog = new THREE.Fog(0x02030a, 10, 45);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const blueLight = new THREE.PointLight(0x00f0ff, 40, 100);
    blueLight.position.set(5, 5, 5);
    scene.add(blueLight);

    const pinkLight = new THREE.PointLight(0xff3cac, 40, 100);
    pinkLight.position.set(-5, 3, 5);
    scene.add(pinkLight);

    // Grid floor
    const grid = new THREE.GridHelper(
      100,
      100,
      0x00f0ff,
      0x222244
    );

    grid.position.y = -3;
    scene.add(grid);

    // Main sphere
    const sphereGeometry = new THREE.IcosahedronGeometry(2, 20);

    const sphereMaterial = new THREE.MeshPhysicalMaterial({
      color:0x7a5cff,
      emissive:0x220044,
      metalness:0.7,
      roughness:0.15,
      clearcoat:1,
      transparent:true,
      opacity:0.95
    });

    const sphere = new THREE.Mesh(
      sphereGeometry,
      sphereMaterial
    );

    scene.add(sphere);

    // Wireframe shell
    const wireframe = new THREE.Mesh(
      sphereGeometry,
      new THREE.MeshBasicMaterial({
        color:0x00f0ff,
        wireframe:true,
        transparent:true,
        opacity:0.35
      })
    );

    wireframe.scale.set(1.15,1.15,1.15);

    scene.add(wireframe);

    // Floating particles
    const particlesCount = 2500;

    const positions = new Float32Array(particlesCount * 3);

    for(let i = 0; i < particlesCount * 3; i++){

      positions[i] = (Math.random() - 0.5) * 60;
    }

    const particlesGeometry = new THREE.BufferGeometry();

    particlesGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const particlesMaterial = new THREE.PointsMaterial({
      color:0xffffff,
      size:0.04,
      transparent:true,
      opacity:0.8
    });

    const particles = new THREE.Points(
      particlesGeometry,
      particlesMaterial
    );

    scene.add(particles);

    // Floating rings
    const rings = [];

    for(let i = 0; i < 5; i++){

      const ringGeometry = new THREE.TorusGeometry(
        3 + i * 0.5,
        0.015,
        16,
        200
      );

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0x00f0ff : 0xff3cac,
        transparent:true,
        opacity:0.5
      });

      const ring = new THREE.Mesh(
        ringGeometry,
        ringMaterial
      );

      ring.rotation.x = Math.random() * Math.PI;
      ring.rotation.y = Math.random() * Math.PI;

      scene.add(ring);
      rings.push(ring);
    }

    // Clock
    const clock = new THREE.Clock();

    // Animation
    function animate(){

      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // Main sphere
      sphere.rotation.x += 0.002;
      sphere.rotation.y += 0.004;

      sphere.position.y = Math.sin(t * 1.5) * 0.3;

      // Wireframe
      wireframe.rotation.x -= 0.001;
      wireframe.rotation.y -= 0.003;

      // Rings
      rings.forEach((ring, i)=>{

        ring.rotation.x += 0.001 + i * 0.0004;
        ring.rotation.y += 0.002 + i * 0.0005;

        ring.position.y =
          Math.sin(t + i) * 0.2;
      });

      // Particles
      particles.rotation.y += 0.0008;

      // Camera movement
      camera.position.x += (mouse.x * 3 - camera.position.x) * 0.03;

      camera.position.y +=
        (mouse.y * 2 + 2 - camera.position.y) * 0.03;

      camera.lookAt(0,0,0);

      renderer.render(scene, camera);
    }

    animate();

    // Resize
    window.addEventListener("resize", ()=>{

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

  </script>

</body>
</html>
