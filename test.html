<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Animated Three.js Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:#050816;
      font-family:Arial, Helvetica, sans-serif;
      color:white;
    }

    canvas{
      display:block;
    }

    .overlay{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      pointer-events:none;
      z-index:10;
    }

    h1{
      font-size:4rem;
      letter-spacing:4px;
      text-transform:uppercase;
      animation: glow 2s infinite alternate;
    }

    p{
      margin-top:15px;
      font-size:1.1rem;
      opacity:0.8;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #00ffff,
                    0 0 20px #00ffff,
                    0 0 40px #00ffff;
      }
      to{
        text-shadow:0 0 20px #ff00ff,
                    0 0 40px #ff00ff,
                    0 0 60px #ff00ff;
      }
    }

    .btn{
      margin-top:25px;
      padding:14px 35px;
      border:none;
      border-radius:40px;
      background:linear-gradient(45deg,#00ffff,#ff00ff);
      color:white;
      font-size:1rem;
      cursor:pointer;
      pointer-events:auto;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.1);
      box-shadow:0 0 20px #00ffff;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>Three JS</h1>
    <p>Beautiful Animated 3D Experience</p>
    <button class="btn">Explore</button>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

    // Scene
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.z = 8;

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias:true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Torus Geometry
    const geometry = new THREE.TorusKnotGeometry(2, 0.5, 200, 32);

    // Material
    const material = new THREE.MeshStandardMaterial({
      color:0x00ffff,
      metalness:0.8,
      roughness:0.2
    });

    const torus = new THREE.Mesh(geometry, material);
    scene.add(torus);

    // Lights
    const pointLight = new THREE.PointLight(0xffffff, 3);
    pointLight.position.set(5,5,5);
    scene.add(pointLight);

    const pointLight2 = new THREE.PointLight(0xff00ff, 3);
    pointLight2.position.set(-5,-5,5);
    scene.add(pointLight2);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    // Particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 3000;

    const posArray = new Float32Array(particlesCount * 3);

    for(let i = 0; i < particlesCount * 3; i++){
      posArray[i] = (Math.random() - 0.5) * 30;
    }

    particlesGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(posArray, 3)
    );

    const particlesMaterial = new THREE.PointsMaterial({
      size:0.03,
      color:0xffffff
    });

    const particlesMesh = new THREE.Points(
      particlesGeometry,
      particlesMaterial
    );

    scene.add(particlesMesh);

    // Mouse movement
    let mouseX = 0;
    let mouseY = 0;

    document.addEventListener('mousemove', (event)=>{
      mouseX = (event.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (event.clientY / window.innerHeight - 0.5) * 2;
    });

    // Animation
    function animate(){
      requestAnimationFrame(animate);

      torus.rotation.x += 0.005;
      torus.rotation.y += 0.01;

      torus.position.x = mouseX;
      torus.position.y = -mouseY;

      particlesMesh.rotation.y += 0.0008;

      renderer.render(scene, camera);
    }

    animate();

    // Responsive
    window.addEventListener('resize', ()=>{

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
