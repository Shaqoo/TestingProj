<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multiplayer 3D Room</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:#050510;
      font-family:Arial, sans-serif;
    }

    #gameCanvas{
      width:100vw;
      height:100vh;
      display:block;
      touch-action:none;
    }

    .ui{
      position:absolute;
      top:20px;
      left:20px;
      z-index:10;
      color:white;
    }

    .title{
      font-size:32px;
      font-weight:900;
      letter-spacing:3px;

      background:linear-gradient(
        90deg,
        #00f0ff,
        #7b61ff,
        #ff4fd8
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .status{
      margin-top:10px;
      color:#ffffffaa;
      letter-spacing:2px;
      font-size:14px;
    }

    .panel{
      position:absolute;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);

      padding:16px 22px;

      border-radius:20px;

      background:rgba(255,255,255,0.06);

      backdrop-filter:blur(12px);

      border:1px solid rgba(255,255,255,0.1);

      color:white;
      z-index:10;

      letter-spacing:2px;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="ui">
    <div class="title">MULTIVERSE ROOM</div>
    <div class="status">
      Multiplayer Babylon.js Space
    </div>
  </div>

  <div class="panel">
    WASD = Move • Mouse = Rotate Camera
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>

  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>

    // =========================================
    // BASIC SERVER CONNECTION
    // =========================================

    // Replace with your server URL
    const socket = io("http://localhost:3000");

    // =========================================
    // BABYLON ENGINE
    // =========================================

    const canvas =
      document.getElementById("gameCanvas");

    const engine =
      new BABYLON.Engine(canvas, true);

    const scene =
      new BABYLON.Scene(engine);

    scene.clearColor =
      new BABYLON.Color4(0.02,0.02,0.07,1);

    // =========================================
    // CAMERA
    // =========================================

    const camera =
      new BABYLON.FreeCamera(
        "camera",
        new BABYLON.Vector3(0,3,-10),
        scene
      );

    camera.attachControl(canvas, true);

    camera.speed = 0.25;

    // =========================================
    // LIGHTS
    // =========================================

    const hemi =
      new BABYLON.HemisphericLight(
        "light",
        new BABYLON.Vector3(0,1,0),
        scene
      );

    hemi.intensity = 0.9;

    const neonLight =
      new BABYLON.PointLight(
        "neon",
        new BABYLON.Vector3(0,5,0),
        scene
      );

    neonLight.diffuse =
      new BABYLON.Color3(0,1,1);

    neonLight.intensity = 60;

    // =========================================
    // GROUND
    // =========================================

    const ground =
      BABYLON.MeshBuilder.CreateGround(
        "ground",
        {
          width:100,
          height:100
        },
        scene
      );

    const groundMat =
      new BABYLON.StandardMaterial(
        "groundMat",
        scene
      );

    groundMat.wireframe = true;

    groundMat.emissiveColor =
      new BABYLON.Color3(0,0.4,0.8);

    ground.material = groundMat;

    // =========================================
    // GLOW
    // =========================================

    const glow =
      new BABYLON.GlowLayer(
        "glow",
        scene
      );

    glow.intensity = 1.5;

    // =========================================
    // PLAYER
    // =========================================

    const player =
      BABYLON.MeshBuilder.CreateSphere(
        "player",
        {
          diameter:1.2
        },
        scene
      );

    player.position.y = 1;

    const playerMat =
      new BABYLON.StandardMaterial(
        "playerMat",
        scene
      );

    playerMat.emissiveColor =
      new BABYLON.Color3(0.5,0.2,1);

    player.material = playerMat;

    // =========================================
    // OTHER PLAYERS
    // =========================================

    const players = {};

    // =========================================
    // KEYBOARD CONTROLS
    // =========================================

    const keys = {};

    window.addEventListener("keydown", (e)=>{
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener("keyup", (e)=>{
      keys[e.key.toLowerCase()] = false;
    });

    // =========================================
    // MOVEMENT
    // =========================================

    scene.onBeforeRenderObservable.add(()=>{

      if(keys["w"]){
        player.position.z += 0.15;
      }

      if(keys["s"]){
        player.position.z -= 0.15;
      }

      if(keys["a"]){
        player.position.x -= 0.15;
      }

      if(keys["d"]){
        player.position.x += 0.15;
      }

      // Camera follow
      camera.position.x =
        player.position.x;

      camera.position.z =
        player.position.z - 10;

      camera.position.y =
        player.position.y + 4;

      camera.setTarget(player.position);

      // Send player data
      socket.emit("playerMove", {
        x: player.position.x,
        y: player.position.y,
        z: player.position.z
      });

      // Animate player
      player.rotation.y += 0.02;
    });

    // =========================================
    // RECEIVE PLAYERS
    // =========================================

    socket.on("playersUpdate", (serverPlayers)=>{

      for(const id in serverPlayers){

        if(id === socket.id) continue;

        const data = serverPlayers[id];

        // Create new player
        if(!players[id]){

          const mesh =
            BABYLON.MeshBuilder.CreateBox(
              "remotePlayer",
              {
                size:1.2
              },
              scene
            );

          mesh.position.y = 1;

          const mat =
            new BABYLON.StandardMaterial(
              "mat",
              scene
            );

          mat.emissiveColor =
            new BABYLON.Color3(
              Math.random(),
              Math.random(),
              Math.random()
            );

          mesh.material = mat;

          players[id] = mesh;
        }

        // Update player position
        players[id].position.x = data.x;
        players[id].position.y = data.y;
        players[id].position.z = data.z;

        players[id].rotation.y += 0.02;
      }
    });

    // =========================================
    // REMOVE DISCONNECTED PLAYERS
    // =========================================

    socket.on("playerDisconnected", (id)=>{

      if(players[id]){

        players[id].dispose();

        delete players[id];
      }
    });

    // =========================================
    // FLOATING ENERGY OBJECTS
    // =========================================

    for(let i = 0; i < 25; i++){

      const orb =
        BABYLON.MeshBuilder.CreateSphere(
          "orb",
          {
            diameter:0.5
          },
          scene
        );

      orb.position.x =
        (Math.random() - 0.5) * 40;

      orb.position.y =
        Math.random() * 6 + 1;

      orb.position.z =
        (Math.random() - 0.5) * 40;

      const orbMat =
        new BABYLON.StandardMaterial(
          "orbMat",
          scene
        );

      orbMat.emissiveColor =
        Math.random() > 0.5
        ? new BABYLON.Color3(0,1,1)
        : new BABYLON.Color3(1,0.2,0.8);

      orb.material = orbMat;

      scene.registerBeforeRender(()=>{

        orb.position.y +=
          Math.sin(
            performance.now() * 0.001 + i
          ) * 0.003;

        orb.rotation.y += 0.01;
      });
    }

    // =========================================
    // RENDER LOOP
    // =========================================

    engine.runRenderLoop(()=>{

      scene.render();
    });

    window.addEventListener("resize", ()=>{

      engine.resize();
    });

  </script>

</body>
</html>
