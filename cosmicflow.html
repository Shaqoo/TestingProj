<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Three.js Cosmic Waves</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:#050816;
      font-family:Arial, Helvetica, sans-serif;
    }

    canvas{
      display:block;
    }

    .overlay{
      position:absolute;
      inset:0;
      pointer-events:none;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      z-index:10;
      color:white;
      text-align:center;
    }

    .title{
      font-size:clamp(3rem,8vw,7rem);
      font-weight:900;
      letter-spacing:4px;
      text-transform:uppercase;
      background:linear-gradient(90deg,#7cf7ff,#7a7dff,#ff7ad9);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      animation: glow 3s ease-in-out infinite alternate;
    }

    .subtitle{
      margin-top:16px;
      font-size:1rem;
      opacity:0.8;
      letter-spacing:3px;
    }

    @keyframes glow{
      from{
        filter:drop-shadow(0 0 10px rgba(124,247,255,0.3));
      }
      to{
        filter:drop-shadow(0 0 35px rgba(255,122,217,0.8));
      }
    }

    .corner{
      position:absolute;
      bottom:20px;
      right:20px;
      color:#ffffff88;
      font-size:14px;
      letter-spacing:2px;
      z-index:10;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="title">COSMIC FLOW</div>
    <div class="subtitle">INTERACTIVE THREE.JS EXPERIENCE</div>
  </div>

  <div class="corner">
    MOVE YOUR MOUSE ✨
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';

    // Scene
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050816, 0.035);

    // Camera
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.z = 8;

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias:true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Mouse
    const mouse = {
      x:0,
      y:0
    };

    window.addEventListener('mousemove', (e)=>{
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Galaxy particles
    const particlesCount = 5000;
    const positions = new Float32Array(particlesCount * 3);
    const colors = new Float32Array(particlesCount * 3);

    const colorInside = new THREE.Color("#7cf7ff");
    const colorOutside = new THREE.Color("#ff7ad9");

    for(let i = 0; i < particlesCount; i++){

      const i3 = i * 3;

      const radius = Math.random() * 10;
      const spin = radius * 1.5;
      const branchAngle = ((i % 5) / 5) * Math.PI * 2;

      positions[i3] =
        Math.cos(branchAngle + spin) * radius;

      positions[i3 + 1] =
        (Math.random() - 0.5) * 2;

      positions[i3 + 2] =
        Math.sin(branchAngle + spin) * radius;

      const mixedColor = colorInside.clone();
      mixedColor.lerp(colorOutside, radius / 10);

      colors[i3] = mixedColor.r;
      colors[i3 + 1] = mixedColor.g;
      colors[i3 + 2] = mixedColor.b;
    }

    const particlesGeometry = new THREE.BufferGeometry();

    particlesGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(positions, 3)
    );

    particlesGeometry.setAttribute(
      'color',
      new THREE.BufferAttribute(colors, 3)
    );

    const particlesMaterial = new THREE.PointsMaterial({
      size:0.05,
      vertexColors:true,
      blending:THREE.AdditiveBlending,
      transparent:true,
      depthWrite:false
    });

    const particles = new THREE.Points(
      particlesGeometry,
      particlesMaterial
    );

    scene.add(particles);

    // Floating torus rings
    const rings = [];

    for(let i = 0; i < 3; i++){

      const geometry = new THREE.TorusGeometry(
        1.5 + i,
        0.05,
        32,
        200
      );

      const material = new THREE.MeshBasicMaterial({
        color: new THREE.Color(
          i === 0 ? "#7cf7ff" :
          i === 1 ? "#7a7dff" :
          "#ff7ad9"
        ),
        wireframe:true
      });

      const torus = new THREE.Mesh(geometry, material);

      torus.rotation.x = Math.random() * Math.PI;
      torus.rotation.y = Math.random() * Math.PI;

      scene.add(torus);
      rings.push(torus);
    }

    // Ambient light
    const ambientLight = new THREE.AmbientLight(0xffffff, 1);
    scene.add(ambientLight);

    // Clock
    const clock = new THREE.Clock();

    // Animate
    const animate = () => {

      const elapsed = clock.getElapsedTime();

      // Rotate galaxy
      particles.rotation.y = elapsed * 0.05;

      // Animate rings
      rings.forEach((ring, i) => {

        ring.rotation.x += 0.002 + i * 0.001;
        ring.rotation.y += 0.003 + i * 0.001;

        ring.position.x = Math.sin(elapsed + i) * 0.5;
        ring.position.y = Math.cos(elapsed + i * 2) * 0.5;
      });

      // Camera interaction
      camera.position.x += (mouse.x * 2 - camera.position.x) * 0.03;
      camera.position.y += (-mouse.y * 2 - camera.position.y) * 0.03;

      camera.lookAt(scene.position);

      renderer.render(scene, camera);

      requestAnimationFrame(animate);
    };

    animate();

    // Resize
    window.addEventListener('resize', () => {

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

  </script>

</body>
</html>
